# Cargo deny configuration
# See: https://embarkstudios.github.io/cargo-deny/checks/index.html

[advisories]
unmaintained = "workspace"
yanked = "warn"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "NCSA",
    "Unicode-3.0",
]
confidence-threshold = 0.8
