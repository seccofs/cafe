[package]
name = "cafe-bench"
description = "Comparative benchmark harness: CAFE vs PNG (and later WebP/JPEG XL/AVIF) over the corpus/ dataset."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cafe-format.workspace = true
cafe-codec.workspace = true
image.workspace = true
zstd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[lib]
name = "cafe_bench"
path = "src/lib.rs"

[[bin]]
name = "cafe-bench"
path = "src/main.rs"

[[bin]]
name = "gen-corpus"
path = "src/bin/gen-corpus.rs"

[[bin]]
name = "import-corpus"
path = "src/bin/import-corpus.rs"

[[bench]]
name = "encode_decode"
harness = false
