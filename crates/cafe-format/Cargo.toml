[package]
name = "cafe-format"
description = "CAFE image format: chunk container, IHDR, validation, and the normative spec-as-code invariants. No codec logic (predictors, ZSTD, tiling) lives here — see cafe-codec."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crc32fast.workspace = true
# Used only to validate `jSON` chunk payload syntax (spec section 4.6) —
# this crate never deserializes into an application type or interprets
# the JSON's structure, only checks "is this syntactically valid JSON".
serde_json.workspace = true

[dev-dependencies]
serde = { workspace = true }
toml = { workspace = true }
proptest = { workspace = true }
