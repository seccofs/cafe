name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - name: Enable symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --release

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  simd-parity-aarch64:
    name: SIMD parity (native aarch64 / NEON)
    # Native ARM64 runner (GitHub-hosted, free for public repos) — this is
    # the real NEON validation the `crates/cafe-codec/src/simd/neon.rs`
    # module doc promises, since no ARM hardware is available in local
    # development (AGENTS.md's SIMD v0.2 phase). `dispatch_*`'s NEON path
    # runs unconditionally on aarch64 (no runtime feature check needed,
    # unlike AVX2), so simply running the existing parity test suite here
    # exercises real NEON instructions on real hardware.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run SIMD parity tests natively on aarch64/NEON
        run: cargo test -p cafe-codec --test simd_parity --release

  fuzz:
    name: Fuzz smoke test (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [decode_fuzz, chunk_roundtrip_fuzz]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Run ${{ matrix.target }} for 60s
        run: |
          cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- \
            -max_len=16384 -timeout=10 -max_total_time=60
        working-directory: fuzz

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

# Not yet added, tracked in AGENTS.md's phased roadmap:
#   - compression-regression (needs cafe-bench + corpus, phase 1-2)
#   - security-audit / cargo-deny (re-add once dependencies stabilize)
