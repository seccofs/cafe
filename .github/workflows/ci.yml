name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - name: Enable symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      
      - uses: actions/checkout@v5
      
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Run tests
        run: cargo test --lib --release
      
      - name: Run integration tests
        run: cargo test --release

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Enable symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Enable symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target: [decode_fuzz, chunk_roundtrip_fuzz]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Run ${{ matrix.target }} for 60s
        run: cargo fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60
        working-directory: fuzz

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  aarch64-cross-compile:
    name: ARM64 Cross-Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      - name: Install aarch64 C cross-compiler (for zstd-sys)
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross-compile check (lib only, no dev-deps)
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check --target aarch64-unknown-linux-gnu --lib

      - name: Cross-compile clippy (lib only, no dev-deps)
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo clippy --target aarch64-unknown-linux-gnu --lib -- -D warnings

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Enable symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          log-level: warn

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Enable symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
