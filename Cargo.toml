[package]
name = "cafe"
version = "1.2.0"
edition = "2021"
authors = ["Daniel Secco <barista@format.cafe>"]
license = "BSD-3-Clause"
description = "CAFE — Compression Adaptative Filtering Experiment. A modern chunk-based image format with ZSTD compression, advanced predictive filters, indexed palette, and structured metadata. v1.2.0: Aggressive AVX2 SIMD acceleration (2.8-3.5x speedup)."
repository = "https://github.com/seccofs/cafe"
documentation = "https://format.cafe"
readme = "README.md"
keywords = ["image", "compression", "format", "zstd", "png", "simd", "avx2"]
categories = ["compression", "encoding"]

[dependencies]
image = "0.25"
zstd = "0.13"
serde_json = "1.0"
half = "2.7"
crc32fast = "1.3"

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[features]
default = ["simd"]
simd = []

[lib]
name = "cafe"
path = "src/cafe.rs"

[[bin]]
name = "cafe-encode"
path = "tools/cafe-encode.rs"

[[bin]]
name = "cafe-decode"
path = "tools/cafe-decode.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1

[[bench]]
name = "encode_decode"
harness = true
