[workspace]
resolver = "2"
members = [
    "crates/cafe-format",
    "crates/cafe-codec",
    "crates/cafe-cli",
    "crates/cafe-bench",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# MSRV is dictated by the `image` crate (a direct production dependency of
# cafe-cli/cafe-bench), not by cafe's own source code, which only needs
# 1.82 (Option::is_none_or). Verified empirically: 1.85.0 fails to build
# this workspace's Cargo.lock (`built@0.8.1` requires >=1.87, `image
# 0.25.10` requires >=1.88.0); 1.88.0 builds cleanly. Bump this only after
# re-verifying with `cargo +<version> check --workspace --all-targets`.
rust-version = "1.88"
authors = ["Daniel Secco <barista@format.cafe>"]
license = "BSD-3-Clause"
repository = "https://github.com/seccofs/cafe"
readme = "README.md"

[workspace.dependencies]
cafe-format = { path = "crates/cafe-format" }
cafe-codec = { path = "crates/cafe-codec" }
cafe-bench = { path = "crates/cafe-bench" }
crc32fast = "1.3"
zstd = "0.13"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
log = "0.4"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
